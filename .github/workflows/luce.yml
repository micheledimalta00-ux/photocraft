name: luce

# Compila l'app Luce (cartella luce/), esegue i test del motore e pubblica l'APK firmato
# come Release scaricabile direttamente dal telefono.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "luce/**"
      - ".github/workflows/luce.yml"

permissions:
  contents: write

concurrency:
  group: luce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: luce
    steps:
      - uses: actions/checkout@v4

      - name: Set up failure reports
        run: |
          cat > "$RUNNER_TEMP/report.sh" <<'SH'
          report() {
            local body
            body=$( { grep -E '^e: |error:|What went wrong|FAILED|Exception' "$1" | head -n 45; echo '----'; tail -n 25 "$1"; } \
              | sed -e 's/\x1b\[[0-9;]*m//g' -e 's#file:///home/runner/work/[^/]*/[^/]*/luce/##g' \
              | cut -c1-400 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$2::$body"
          }
          SH
          echo "BASH_ENV=$RUNNER_TEMP/report.sh" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Modelli IA per le maschere
        run: |
          mkdir -p app/src/main/assets/models
          for f in deeplab_v3.tflite selfie_multiclass.tflite ade20k.tflite magic_touch.tflite face_landmarker.task; do
            curl -fsSL --retry 3 -o "app/src/main/assets/models/$f" "https://github.com/${{ github.repository }}/releases/download/luce-models/$f"
          done
          ls -la app/src/main/assets/models

      - name: Unit tests (motore di elaborazione)
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testReleaseUnitTest 2>&1 | tee "$RUNNER_TEMP/test.log" \
            || { report "$RUNNER_TEMP/test.log" "Test falliti"; exit 1; }

      - name: Build APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log" \
            || { report "$RUNNER_TEMP/build.log" "Compilazione fallita"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Luce.apk"
          ls -la "$RUNNER_TEMP/Luce.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Luce-apk
          path: ${{ runner.temp }}/Luce.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luce-build-${{ github.run_number }}
          name: Luce (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ${{ runner.temp }}/Luce.apk
          body: |
            APK di Luce, editor fotografico open source per Android.
            Scarica **Luce.apk** dal telefono e installalo (consenti l'installazione da origini sconosciute).

  # Prova su un emulatore Android: autodiagnosi delle maschere IA e navigazione con screenshot.
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Luce-apk
          path: luce

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash luce/selftest/run.sh

      - name: Pubblica i risultati
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luce-selftest
          name: Luce — risultati dei test sull'emulatore
          prerelease: true
          files: |
            luce/selftest/selftest-out/*
            luce/selftest/selftest-out/files/*
