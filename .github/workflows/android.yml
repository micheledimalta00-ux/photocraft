name: android

# Builds the Android APK (apps/photocraft-android wrapped by the Gradle project in android/).
# Run it from the Actions tab ("Run workflow"), or let it run on pushes that touch the port.
# The APK is attached to the run as the "PhotoCraft-android" artifact.

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/photocraft-android/**"
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      # Secrets can't be read in a step's `if`; this flag can.
      HAS_SIGNING_KEY: ${{ secrets.PHOTOCRAFT_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # `report LOG TITLE`: on failure, show the end of a log as an annotation on the run's
      # summary page, so the error is readable without opening (or downloading) the full log.
      - name: Set up failure reports
        run: |
          cat > "$RUNNER_TEMP/report.sh" <<'SH'
          report() {
            local body
            body=$(sed -e 's/\x1b\[[0-9;]*m//g' "$1" | grep -v -e '^\s*$' -e '^ *Compiling ' -e '^ *Downloaded ' | tail -n 60 | cut -c1-300 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$2::$body"
          }
          SH
          echo "BASH_ENV=$RUNNER_TEMP/report.sh" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          # Keep compiled dependencies even when a build fails, so the next attempt is quick.
          cache-on-failure: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build the native library
        run: |
          # The runner image ships the Android SDK and several NDKs; use the newest. (A machine
          # variable like this one isn't in the `env` context, so it is read here in the shell.)
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          set -o pipefail
          cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs \
            build --release --locked -p photocraft-android --lib 2>&1 | tee "$RUNNER_TEMP/native.log" \
            || { report "$RUNNER_TEMP/native.log" "Native library build failed"; exit 1; }
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - name: Decode the signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOTOCRAFT_KEYSTORE_BASE64 }}
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/photocraft.jks"
          echo "PHOTOCRAFT_KEYSTORE=$RUNNER_TEMP/photocraft.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          PHOTOCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PHOTOCRAFT_KEYSTORE_PASSWORD }}
          PHOTOCRAFT_KEY_ALIAS: ${{ secrets.PHOTOCRAFT_KEY_ALIAS }}
          PHOTOCRAFT_KEY_PASSWORD: ${{ secrets.PHOTOCRAFT_KEY_PASSWORD }}
          PHOTOCRAFT_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log" \
            || { report "$RUNNER_TEMP/gradle.log" "APK build failed"; exit 1; }
          mv android/app/build/outputs/apk/release/app-release.apk "PhotoCraft-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-android
          path: PhotoCraft-*.apk
          if-no-files-found: error
