name: luce-models

# Scarica i modelli di segmentazione usati dalle maschere IA di Luce e li pubblica
# nella release "luce-models" (fonte unica per la build dell'APK).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/luce-models.yml"

permissions:
  contents: write

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir -p m && cd m
          : > info.txt
          get() { if curl -fsSL --retry 3 -o "$1" "$2"; then echo "OK $1 $(stat -c %s "$1")" >> info.txt; else echo "MANCA $1 $2" >> info.txt; rm -f "$1"; fi; }
          B=https://storage.googleapis.com/mediapipe-models
          get selfie_multiclass.tflite $B/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite
          get deeplab_v3.tflite $B/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite
          get magic_touch.tflite $B/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite
          get face_landmarker.task $B/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          get ade20k.tflite "https://tfhub.dev/sayakpaul/lite-model/deeplabv3-mobilenetv2-ade20k/1/default/2?lite-format=tflite"
          for repo in https://repo1.maven.org/maven2 https://dl.google.com/dl/android/maven2; do
            for a in tasks-vision tasks-core; do
              echo "== $repo $a" >> info.txt
              curl -fsSL "$repo/com/google/mediapipe/$a/maven-metadata.xml" >> info.txt 2>&1 || echo "no metadata" >> info.txt
            done
          done
          M=https://repo1.maven.org/maven2/com/google/mediapipe
          get tasks-vision-0.10.14.aar $M/tasks-vision/0.10.14/tasks-vision-0.10.14.aar
          get tasks-core-0.10.14.aar $M/tasks-core/0.10.14/tasks-core-0.10.14.aar
          get tasks-vision-0.10.14.pom $M/tasks-vision/0.10.14/tasks-vision-0.10.14.pom
          cat info.txt
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luce-models
          name: Luce — modelli IA
          prerelease: true
          files: m/*
